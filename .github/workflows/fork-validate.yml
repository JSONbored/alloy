# Fork-only validation (never for upstream): runs the patched packages' own tests with -race on GitHub's
# runners, the journal package under its build tag against the runner's live journald.
name: Fork validation
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: v2026.5.18
        sha256: cfac593469d028d7ae5fe36e37bd7c59118b5238e92d8a876209578464f24a84
        install_args: go
    - run: sudo apt-get update && sudo apt-get install -y libsystemd-dev
    - run: go vet ./internal/component/pyroscope/scrape/... ./internal/service/remotecfg/... ./internal/component/loki/source/file/...
    - run: go test -race -count=1 -v ./internal/component/pyroscope/scrape/ ./internal/service/remotecfg/ ./internal/component/loki/source/file/ ./internal/component/common/loki/
    - run: go vet -tags promtail_journal_enabled ./internal/component/loki/source/journal/...
    - run: go test -race -count=1 -tags promtail_journal_enabled -v ./internal/component/loki/source/journal/
